name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore HealthcareClaims.slnx
      - run: dotnet build HealthcareClaims.slnx -c Release --no-restore
      - run: dotnet test HealthcareClaims.slnx -c Release --no-build --logger trx
      - run: dotnet publish src/Claims.Api -c Release --no-restore -o artifacts/app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
